name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet-tests:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TaskTracker.slnx

      - name: Build
        run: dotnet build TaskTracker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskTracker.slnx --configuration Release --no-build

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: dotnet-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore .NET dependencies
        run: dotnet restore TaskTracker.slnx

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Start E2E database
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Update E2E database
        run: dotnet ef database update --project TaskTracker.Api --startup-project TaskTracker.Api
        env:
          ASPNETCORE_ENVIRONMENT: E2E

      - name: Install frontend dependencies
        working-directory: TaskTracker.Ui
        run: npm ci

      - name: Build frontend
        working-directory: TaskTracker.Ui
        run: npm run build

      - name: Install E2E dependencies
        working-directory: TaskTracker.E2E.Tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: TaskTracker.E2E.Tests
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: TaskTracker.E2E.Tests
        run: npx playwright test
        env:
          ASPNETCORE_ENVIRONMENT: E2E

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            TaskTracker.E2E.Tests/playwright-report/
            TaskTracker.E2E.Tests/test-results/
          retention-days: 7

      - name: Stop E2E database
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

  publish-images:
    name: Publish production images
    runs-on: ubuntu-24.04
    needs:
      - dotnet-tests
      - playwright-e2e

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        id: api-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: TaskTracker.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stevenb32/tasktracker-api:${{ github.sha }}

      - name: Build and push UI
        id: ui-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: TaskTracker.Ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stevenb32/tasktracker-ui:${{ github.sha }}

      - name: Show published image digests
        shell: bash
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          UI_DIGEST: ${{ steps.ui-image.outputs.digest }}
        run: |
          set -euo pipefail

          echo "TaskTracker production images published successfully."
          echo
          echo "API:"
          echo "ghcr.io/stevenb32/tasktracker-api@${API_DIGEST}"
          echo
          echo "UI:"
          echo "ghcr.io/stevenb32/tasktracker-ui@${UI_DIGEST}"

          {
            echo "## TaskTracker production images"
            echo
            echo '```text'
            echo "ghcr.io/stevenb32/tasktracker-api@${API_DIGEST}"
            echo "ghcr.io/stevenb32/tasktracker-ui@${UI_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"